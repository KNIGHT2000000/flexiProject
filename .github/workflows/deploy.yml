name: AWS Serverless CI/CD Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  validate-and-test:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate CloudFormation SAM Template
        run: cfn-lint template.yaml

      - name: Run Backend Tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Test Frontend Build
        run: |
          cd frontend
          npm run build

  deploy-to-aws:
    name: Deploy to AWS Free Tier
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM Serverless Application
        run: |
          sam build --template template.yaml

      - name: Deploy SAM Stack to AWS
        run: |
          STACK_NAME="phishguard-cloud-${{ env.ENVIRONMENT }}"
          STATUS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --region "${{ env.AWS_REGION }}" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Current stack status: ${STATUS}"
          if [ "${STATUS}" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting previous rolled-back stack before fresh deployment..."
            aws cloudformation delete-stack --stack-name "${STACK_NAME}" --region "${{ env.AWS_REGION }}"
            aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}" --region "${{ env.AWS_REGION }}"
            echo "Previous stack deleted successfully."
          fi

          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="${{ env.ENVIRONMENT }}" \
              LogRetentionInDays=14 \
              VirusTotalApiKey="${{ secrets.VIRUSTOTAL_API_KEY }}" \
              GoogleSafeBrowsingApiKey="${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Extract CloudFormation Outputs
        id: stack-outputs
        run: |
          STACK_NAME="phishguard-cloud-${{ env.ENVIRONMENT }}"
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs" \
            --output json)

          API_ENDPOINT=$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue')
          BUCKET_NAME=$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')
          DISTRIBUTION_ID=$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')
          CF_DOMAIN=$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="CloudFrontDomain" or .OutputKey=="CloudFrontDomainName") | .OutputValue')

          echo "api_endpoint=${API_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "distribution_id=${DISTRIBUTION_ID}" >> $GITHUB_OUTPUT
          echo "cf_domain=${CF_DOMAIN}" >> $GITHUB_OUTPUT

          echo "Deployed API Gateway: ${API_ENDPOINT}"
          echo "Frontend Bucket: ${BUCKET_NAME}"
          echo "CloudFront CDN: https://${CF_DOMAIN}"

      - name: Build React Frontend for Production
        env:
          VITE_API_URL: ${{ steps.stack-outputs.outputs.api_endpoint }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Sync Static Assets to S3 Private Origin
        run: |
          BUCKET="${{ steps.stack-outputs.outputs.bucket_name }}"
          # Cache immutable versioned chunks for 1 year
          aws s3 sync frontend/dist/assets "s3://${BUCKET}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Sync root HTML/entrypoint without cache
          aws s3 sync frontend/dist "s3://${BUCKET}" \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Global Edge Cache
        run: |
          DIST_ID="${{ steps.stack-outputs.outputs.distribution_id }}"
          aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/*"

      - name: Smoke Test Deployed Health Endpoint
        run: |
          API="${{ steps.stack-outputs.outputs.api_endpoint }}"
          echo "Testing ${API}/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API}/health")
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed with status ${STATUS}"
            exit 1
          fi
          echo "✓ API Health check passed with HTTP 200 OK"

      - name: Publish Deployment Summary
        run: |
          CF="https://${{ steps.stack-outputs.outputs.cf_domain }}"
          API="${{ steps.stack-outputs.outputs.api_endpoint }}"
          echo "### 🚀 PhishGuard Cloud Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Web Dashboard (CloudFront)** | [${CF}](${CF}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 **API Gateway Endpoint** | [${API}](${API}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 **Swagger / OpenAPI Documentation** | [${API}/docs](${API}/docs) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Environment**: \`${{ env.ENVIRONMENT }}\` | **Region**: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
