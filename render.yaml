services:
  # ── PhishGuard FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: phishguard-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./phishing.db
      - key: RATE_LIMIT
        value: "60"
      - key: RATE_WINDOW
        value: "60"
      - key: VIRUSTOTAL_API_KEY
        sync: false

  # ── PhishGuard React Static Frontend ─────────────────────────────────────────
  - type: web
    name: phishguard-web
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phishguard-api
          property: host
